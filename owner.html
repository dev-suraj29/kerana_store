<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechExpert Nexgen — Sourcing Control Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#0B192C',
            brandSky: '#38BDF8',
            brandSkyDeep: '#0EA5E9',
            brandSlate: '#1E293B'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white dark:bg-[#060B13] text-brandDark dark:text-slate-200 antialiased p-6 sm:p-12 transition-colors duration-300">

  <div class="bg-blur bg1 opacity-20"></div>
  <div class="bg-blur bg2 opacity-20"></div>

  <header class="max-w-[1200px] mx-auto flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-12">
    <div>
      <span class="font-mono text-[10px] text-brandSkyDeep dark:text-brandSky tracking-widest uppercase block">// SYSTEM CONTROL GATE (GITHUB DB)</span>
      <h1 class="text-3xl font-bold tracking-tight text-brandDark dark:text-white">Stock & Inventory Dashboard</h1>
    </div>
    <div class="flex gap-4">
      <button id="theme-toggle" class="w-10 h-10 rounded-full border border-slate-200 dark:border-slate-800 flex items-center justify-center bg-slate-50 dark:bg-slate-900 text-brandDark dark:text-white">💡</button>
      <a href="store.html" class="px-5 py-2.5 rounded-full bg-brandDark dark:bg-white text-white dark:text-brandDark text-xs font-mono font-medium hover:bg-brandSkyDeep dark:hover:bg-brandSky transition-all">← Back to Storefront</a>
    </div>
  </header>

  <main class="max-w-[1200px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <section class="lg:col-span-5 bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-900 rounded-[28px] p-6 h-fit">
      <h2 class="text-base font-semibold text-brandDark dark:text-white mb-4 tracking-tight">Provision New Component Matrix</h2>
      
      <form id="admin-add-form" class="flex flex-col gap-4">
        <div>
          <label class="text-[10px] font-mono text-slate-400 block mb-1">Product Component Name</label>
          <input type="text" id="prod-name" required placeholder="e.g., RTX 5090 Graphics Card" class="form-input text-xs w-full bg-white dark:bg-slate-950">
        </div>

        <div>
          <label class="text-[10px] font-mono text-slate-400 block mb-1">Architecture Class</label>
          <div class="flex gap-2">
            <select id="prod-cat" required class="form-input text-xs bg-white dark:bg-slate-950 flex-1 cursor-pointer">
            </select>
            <button type="button" onclick="promptAddCategory()" title="Add Custom Category"
                    class="px-3 rounded-lg bg-emerald-500/10 hover:bg-emerald-500 text-emerald-500 hover:text-white border border-emerald-500/20 transition-all text-sm flex items-center justify-center font-bold">
              +
            </button>
            <button type="button" onclick="promptRemoveCategory()" title="Remove Active Category"
                    class="px-3.5 rounded-lg bg-rose-500/10 hover:bg-rose-500 text-rose-500 hover:text-white border border-rose-500/20 transition-all text-xs flex items-center justify-center font-bold">
              ✕
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-[10px] font-mono text-slate-400 block mb-1">Price Configuration (INR)</label>
            <input type="number" id="prod-price" required min="0" placeholder="e.g., 45000" class="form-input text-xs font-mono w-full bg-white dark:bg-slate-950">
          </div>
          <div>
            <label class="text-[10px] font-mono text-slate-400 block mb-1">Initial Stock Allocation</label>
            <select id="prod-stock" class="form-input text-xs bg-white dark:bg-slate-950 w-full cursor-pointer">
              <option value="In Stock">In Stock</option>
              <option value="Limited Stock">Limited Stock</option>
              <option value="Out of Stock">Out of Stock</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-[10px] font-mono text-slate-400 block mb-1">Hardware Specification Details</label>
          <textarea id="prod-details" rows="3" placeholder="Enter board specs, logic architectures processing, testing parameters configurations..." class="form-input text-xs w-full bg-white dark:bg-slate-950 resize-none p-2.5 leading-relaxed"></textarea>
        </div>

        <div class="border-t border-slate-200/40 dark:border-slate-800/40 pt-4 mt-1">
          <span class="text-[9px] font-mono font-bold tracking-wider text-brandSkyDeep dark:text-brandSky uppercase block mb-3">// Media Layer Target Matrix Paths</span>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="text-[9px] font-mono text-slate-400 block mb-0.5">Primary Display Image Link</label>
              <input type="text" id="prod-img-1" required placeholder="Image 1 Asset Path" class="form-input text-[11px] w-full bg-white dark:bg-slate-950">
            </div>
            <div>
              <label class="text-[9px] font-mono text-slate-400 block mb-0.5">Alternative Image Link 2</label>
              <input type="text" id="prod-img-2" placeholder="Image 2 Asset Path" class="form-input text-[11px] w-full bg-white dark:bg-slate-950">
            </div>
            <div>
              <label class="text-[9px] font-mono text-slate-400 block mb-0.5">Alternative Image Link 3</label>
              <input type="text" id="prod-img-3" placeholder="Image 3 Asset Path" class="form-input text-[11px] w-full bg-white dark:bg-slate-950">
            </div>
            <div>
              <label class="text-[9px] font-mono text-slate-400 block mb-0.5">Alternative Image Link 4</label>
              <input type="text" id="prod-img-4" placeholder="Image 4 Asset Path" class="form-input text-[11px] w-full bg-white dark:bg-slate-950">
            </div>
          </div>

          <div class="mt-3">
            <label class="text-[9px] font-mono text-slate-400 block mb-0.5">Product MP4 Demonstration Video Stream Link</label>
            <input type="text" id="prod-video" placeholder="https://domain.com/video.mp4" class="form-input text-[11px] w-full bg-white dark:bg-slate-950">
          </div>
        </div>

        <button type="submit" class="btn-primary w-full py-3.5 rounded-xl text-xs font-mono tracking-wide mt-2">Initialize Asset Node</button>
      </form>
    </section>

    <section class="lg:col-span-7 bg-white dark:bg-[#0b1320]/40 border border-slate-100 dark:border-slate-900 rounded-[28px] overflow-hidden shadow-xl h-fit">
      <div class="p-6 border-b border-slate-100 dark:border-slate-900/60">
        <h2 class="text-base font-semibold text-brandDark dark:text-white tracking-tight">Active Hardware Stock Matrix</h2>
      </div>
      <div class="overflow-x-auto w-full">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 dark:bg-slate-950/60 border-b border-slate-100 dark:border-slate-900 text-[10px] font-mono text-slate-400 uppercase tracking-wider">
              <th class="p-4 w-20">ID</th>
              <th class="p-4">Component Model</th>
              <th class="p-4">Category</th>
              <th class="p-4">Custom Price</th>
              <th class="p-4">Stock Registry</th>
              <th class="p-4 text-center">Operational Commands</th>
            </tr>
          </thead>
          <tbody id="admin-table-body">
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
/**
 * TechExpert Nexgen — Admin Dashboard Inventory Sourcing Engine
 * PHP Local Server File System Integration Setup
 */

let products = [];
let categories = [];

// Clean relative server pathing definitions
const PRODUCTS_JSON_API = "/api/products.json";
const UPDATE_PHP_API = "/update-products.php";

document.addEventListener("DOMContentLoaded", () => {
    fetchCloudDatabase(() => {
        renderAdminInventoryTable();
        populateCategoryDropdown();
    });
    initializeAdminFormSubmission();
    initializeSystemThemeEngine();
});

// 1. READ DATABASES SECURELY FROM THE LOCAL REPOSITORY
function fetchCloudDatabase(callback) {
  fetch(`${PRODUCTS_JSON_API}?t=${new Date().getTime()}`)
    .then(res => {
      if (!res.ok) throw new Error("Server data pipeline read disruption.");
      return res.json();
    })
    .then(data => {
      if (data) {
        products = data.products || [];
        categories = data.categories || [];
        if (callback) callback();
      }
    })
    .catch(err => console.error("Database load failed:", err));
}

// 2. WRITE/UPDATE THE DATABASES VIA PHP ENDPOINT
function writeCloudDatabase(logMessage = "Synchronize inventory parameters") {
  const payload = {
    password: "amit@1993", // Matches your PHP script security parameter
    categories: categories,
    products: products
  };

  fetch(UPDATE_PHP_API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  })
  .then(res => {
    if (!res.ok) throw new Error("HTTP connection protocol failure.");
    return res.json();
  })
  .then(data => {
    if (data && data.success) {
      showToast(data.message || "Database synchronized safely!");
    } else {
      showToast("Access configuration rejected: " + (data.message || "Unknown error"));
    }
  })
  .catch(err => {
    console.error("Local file system writing sequence faulted:", err);
    showToast("Write synchronization error.");
  });
}

function populateCategoryDropdown() {
  const selectElement = document.getElementById("prod-cat");
  if (!selectElement) return;
  const currentVal = selectElement.value;
  selectElement.innerHTML = "";
  categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.text = cat;
    selectElement.appendChild(opt);
  });
  if (currentVal && categories.includes(currentVal)) selectElement.value = currentVal;
}

window.promptAddCategory = function() {
  const newCat = window.prompt("Enter new category identification name to register:");
  if (!newCat) return;
  const cleanCat = newCat.trim();
  if (cleanCat === "" || categories.some(c => c.toLowerCase() === cleanCat.toLowerCase())) return;

  categories.push(cleanCat);
  populateCategoryDropdown();
  writeCloudDatabase(`Added custom structural category: ${cleanCat}`);
};

window.promptRemoveCategory = function() {
  const selectElement = document.getElementById("prod-cat");
  if (!selectElement) return;
  const currentSelection = selectElement.value;
  if (!currentSelection || !window.confirm(`Delete category: "${currentSelection}"?`)) return;

  categories = categories.filter(c => c !== currentSelection);
  populateCategoryDropdown();
  writeCloudDatabase(`Removed category module: ${currentSelection}`);
};

function renderAdminInventoryTable() {
  const tbody = document.getElementById("admin-table-body");
  if (!tbody) return;
  tbody.innerHTML = "";
  products.sort((a, b) => a.id - b.id);

  products.forEach(p => {
    const primaryImg = (p.images && p.images.length > 0) ? p.images[0] : 'https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?auto=format&fit=crop&w=600&q=80';
    const tr = document.createElement("tr");
    tr.className = "border-b border-slate-100 dark:border-slate-900/60 text-xs text-slate-700 dark:text-slate-300";
    tr.innerHTML = `
      <td class="p-4">
        <input type="number" value="${p.id}" class="w-16 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg px-2 py-1 font-mono text-center text-brandSkyDeep dark:text-brandSky font-bold focus:outline-none" onchange="handleSequenceShift(${p.id}, this.value)">
      </td>
      <td class="p-4">
        <div class="flex items-center gap-3"><img src="${primaryImg}" class="w-8 h-8 rounded object-cover bg-slate-100"><span class="font-medium text-brandDark dark:text-white">${p.name}</span></div>
      </td>
      <td class="p-4"><span class="px-2 py-1 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800/40 rounded-md font-mono text-[10px] text-slate-500">${p.category}</span></td>
      <td class="p-4">
        <div class="flex items-center gap-1 max-w-[140px]"><span class="text-slate-400 font-medium">₹</span><input type="number" value="${p.price}" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg px-2 py-1 font-mono text-xs font-semibold focus:outline-none" onchange="updateCustomPrice(${p.id}, this.value)"></div>
      </td>
      <td class="p-4">
        <select class="bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg px-2 py-1 cursor-pointer font-medium" onchange="alterStockState(${p.id}, this.value)">
          <option value="In Stock" ${p.stock === 'In Stock' ? 'selected' : ''}>In Stock</option>
          <option value="Limited Stock" ${p.stock === 'Limited Stock' ? 'selected' : ''}>Limited Stock</option>
          <option value="Out of Stock" ${p.stock === 'Out of Stock' ? 'selected' : ''}>Out of Stock</option>
        </select>
      </td>
      <td class="p-4 text-center"><button class="bg-rose-500/10 text-rose-500 border border-rose-500/20 px-3 py-1 rounded-lg hover:bg-rose-500 hover:text-white" onclick="removeProductNode(${p.id})">Remove</button></td>`;
    tbody.appendChild(tr);
  });
}

window.handleSequenceShift = function(oldId, rawNewValue) {
  const newId = parseInt(rawNewValue, 10);
  if (isNaN(newId) || newId < 1) { renderAdminInventoryTable(); return; }
  const targetProduct = products.find(p => p.id === oldId);
  if (!targetProduct) return;

  if (oldId !== newId) {
    products.forEach((prod) => {
      if (prod.id !== oldId) {
        if (oldId < newId) { if (prod.id > oldId && prod.id <= newId) prod.id -= 1; }
        else if (oldId > newId) { if (prod.id >= newId && prod.id < oldId) prod.id += 1; }
      }
    });
    targetProduct.id = newId;
    products.sort((a, b) => a.id - b.id);
    products.forEach((p, idx) => p.id = idx + 1);
    writeCloudDatabase(`Sequence system re-indexed. Shifted entity ${oldId} to position ${newId}`);
    renderAdminInventoryTable();
  }
};

function initializeAdminFormSubmission() {
  const form = document.getElementById("admin-add-form");
  if (!form) return;
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("prod-name").value.trim();
    const category = document.getElementById("prod-cat").value;
    const price = parseInt(document.getElementById("prod-price").value, 10);
    const stock = document.getElementById("prod-stock").value;
    const details = document.getElementById("prod-details") ? document.getElementById("prod-details").value.trim() : "";
    const videoUrl = document.getElementById("prod-video") ? document.getElementById("prod-video").value.trim() : "";
    
    const img1 = document.getElementById("prod-img-1").value.trim();
    const img2 = document.getElementById("prod-img-2").value.trim();
    const img3 = document.getElementById("prod-img-3").value.trim();
    const img4 = document.getElementById("prod-img-4").value.trim();

    const imagesList = [img1, img2, img3, img4].filter(url => url !== "");
    if (imagesList.length === 0) imagesList.push("https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?auto=format&fit=crop&w=600&q=80");

    const nextId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
    products.push({ id: nextId, name, category, price, stock, rating: 5.0, images: imagesList, video: videoUrl, details });
    
    renderAdminInventoryTable();
    writeCloudDatabase(`Added product asset node: ${name}`);
    form.reset();
  });
}

window.updateCustomPrice = function(id, value) {
  const target = products.find(p => p.id === id);
  if (!target) return;
  const formattedPrice = parseInt(value, 10);
  if (isNaN(formattedPrice) || formattedPrice < 0) { renderAdminInventoryTable(); return; }
  target.price = formattedPrice;
  writeCloudDatabase(`Calibrated custom price parameters on entry ID ${id}`);
};

window.alterStockState = function(id, value) {
  const target = products.find(p => p.id === id);
  if (!target) return;
  target.stock = value;
  writeCloudDatabase(`Altered stock allocation status parameters for entry node ${id}`);
};

window.removeProductNode = function(id) {
  if (!confirm("Are you sure you want to delete this structural component row matrix completely?")) return;
  products = products.filter(p => p.id !== id);
  products.sort((a, b) => a.id - b.id);
  products.forEach((p, idx) => p.id = idx + 1);
  renderAdminInventoryTable();
  writeCloudDatabase(`Dropped component row model entity sequence node ${id}`);
};

function initializeSystemThemeEngine() {
  const switchBtn = document.getElementById("theme-toggle");
  if (!switchBtn) return;
  switchBtn.addEventListener("click", () => {
    if (document.documentElement.classList.contains('dark')) {
      document.documentElement.classList.remove('dark'); localStorage.theme = 'light';
    } else {
      document.documentElement.classList.add('dark'); localStorage.theme = 'dark';
    }
  });
}

function showToast(msg) {
  const toast = document.createElement("div");
  toast.className = "toast"; toast.innerText = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add("show"), 100);
  setTimeout(() => { toast.classList.remove("show"); setTimeout(() => toast.remove(), 300); }, 2500);
}
</script>
</body>
</html>
