<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velloux Kirana — Owner Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#0B192C',
            brandSky: '#38BDF8',
            brandSkyDeep: '#0EA5E9',
            brandSlate: '#1E293B'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white dark:bg-[#060B13] text-brandDark dark:text-slate-200 antialiased p-6 sm:p-12 transition-colors duration-300">

  <div class="bg-blur bg1 opacity-20"></div>
  <div class="bg-blur bg2 opacity-20"></div>

  <header class="max-w-[1400px] mx-auto flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-12">
    <div>
      <span class="font-mono text-[10px] text-brandSkyDeep dark:text-brandSky tracking-widest uppercase block">// VELLOUX KIRANA SYSTEM KERNEL</span>
      <h1 class="text-3xl font-bold tracking-tight text-brandDark dark:text-white">Rajkumar Kirana Admin Panel</h1>
    </div>
    <div class="flex gap-4">
      <button id="theme-toggle" class="w-10 h-10 rounded-full border border-slate-200 dark:border-slate-800 flex items-center justify-center bg-slate-50 dark:bg-slate-900 text-brandDark dark:text-white">💡</button>
      <a href="store.html" class="px-5 py-2.5 rounded-full bg-brandDark dark:bg-white text-white dark:text-brandDark text-xs font-mono font-medium hover:bg-brandSkyDeep dark:hover:bg-brandSky transition-all">← Back to Storefront</a>
    </div>
  </header>

  <main class="max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <section id="form-container" class="lg:col-span-5 bg-slate-50 dark:bg-slate-900/30 border border-slate-100 dark:border-slate-900 rounded-[28px] p-6 h-fit transition-all duration-300">
      <h2 id="form-action-title" class="text-base font-semibold text-brandDark dark:text-white mb-4 tracking-tight">Provision Kirana Stock Node</h2>
      
      <form id="kirana-product-form" class="flex flex-col gap-4">
        <div>
          <label class="text-[10px] font-mono text-slate-400 block mb-1">Item / Commodity Name</label>
          <input type="text" id="prod-name" required placeholder="e.g., Premium Basmati Rice" class="w-full text-xs bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 outline-none focus:border-brandSky transition-all">
        </div>

        <div class="grid grid-cols-2 gap-4">
         <div class="flex flex-col gap-2">
  <label class="text-xs font-mono tracking-wide text-slate-400">// COMMODITY CLASS</label>
  
  <select id="product-category" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-3 text-xs focus:outline-none">
    <option value="" disabled selected>Select Existing Class</option>
  </select>

  <input type="text" id="new-category-input" placeholder="Or type a brand new category (e.g., Spices, Snacks)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-3 text-xs focus:outline-none mt-1">
</div>
          <div>
            <label class="text-[10px] font-mono text-slate-400 block mb-1">Retail Price (INR)</label>
            <input type="number" id="prod-price" required min="0" placeholder="e.g., 65" class="w-full text-xs font-mono bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 outline-none focus:border-brandSky transition-all">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-[10px] font-mono text-slate-400 block mb-1">Stock Availability</label>
            <select id="prod-stock" class="w-full text-xs bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2.5 outline-none cursor-pointer">
              <option value="In Stock">In Stock</option>
              <option value="Limited Stock">Limited Stock</option>
              <option value="Out of Stock">Out of Stock</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] font-mono text-slate-400 block mb-1">Display Image Link</label>
            <input type="text" id="prod-image" placeholder="Image URL address" class="w-full text-xs bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 outline-none focus:border-brandSky transition-all">
          </div>
        </div>

        <div>
          <label class="text-[10px] font-mono text-slate-400 block mb-1">Product Description</label>
          <textarea id="prod-details" rows="2" placeholder="Quality parameters, sourcing origins..." class="w-full text-xs bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 outline-none focus:border-brandSky transition-all resize-none"></textarea>
        </div>

        <div class="flex gap-3 mt-2">
          <button type="button" id="cancel-edit-btn" onclick="clearFormAndResetContext()" class="hidden bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 font-mono text-xs px-4 rounded-xl transition-all">Cancel</button>
          <button type="submit" id="submit-form-btn" class="flex-1 py-3.5 bg-brandDark dark:bg-white text-white dark:text-brandDark rounded-xl text-xs font-mono font-medium tracking-wide hover:bg-brandSkyDeep dark:hover:bg-brandSky dark:hover:text-white transition-all shadow-lg">Initialize Stock Node</button>
        </div>
      </form>
    </section>

    <section class="lg:col-span-7 bg-white dark:bg-[#0b1320]/40 border border-slate-100 dark:border-slate-900 rounded-[28px] overflow-hidden shadow-xl h-fit">
      <div class="p-6 border-b border-slate-100 dark:border-slate-900/60 flex justify-between items-center">
        <div>
          <h2 class="text-base font-semibold text-brandDark dark:text-white tracking-tight">Active Inventory Matrix</h2>
          <p class="text-[10px] text-slate-400 font-mono mt-1">// Tap any row mapping to modify item definitions instantly.</p>
        </div>
        <button onclick="refreshLocalMemoryData()" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 rounded-lg font-mono text-[11px] hover:bg-brandSkyDeep hover:text-white transition-all">🔄 Reload</button>
      </div>
      <div class="overflow-x-auto w-full">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 dark:bg-slate-950/60 border-b border-slate-100 dark:border-slate-900 text-[10px] font-mono text-slate-400 uppercase select-none">
              <th class="p-4">Commodity Item</th>
              <th class="p-4">Category</th>
              <th class="p-4">Retail Rate</th>
              <th class="p-4">Availability Status</th>
              <th class="p-4 text-center">Action Parameters</th>
            </tr>
          </thead>
          <tbody id="kirana-table-body" class="text-xs"></tbody>
        </table>
      </div>
    </section>
  </main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
/**
 * Velloux Kirana System — Owner Administration Matrix Dashboard
 * Synchronized with Live Supabase Cloud Database Core
 */

// ========================================================
// SUPABASE CLIENT INITIALIZATION CONFIGURATION
// ========================================================
const SUPABASE_URL = "sb_publishable_J39e0-43SDOkDm5BNiwz5w_vP312Wau";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyc295b2R2b3N1b3ZxdGlzbW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTg2NjgsImV4cCI6MjA5NTM3NDY2OH0.kJYdFik2YAOk3FXTHieOPEI5esy3I_7R5MG-Sz6X3g0";

// Initialize the active connection client instance
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ========================================================
// REPOSITORY TARGET VARIABLES
// ========================================================
let products = [];
let categories = [];
let editingProductId = null;

// --- LIFE CYCLE INITIALIZATION ---
document.addEventListener("DOMContentLoaded", () => {
    // Initial Real-time Database Pull Execution
    refreshLocalMemoryData();
    initializeFormEngine();
    initializeSystemThemeEngine();
});

// ========================================================
// SUPABASE REALTIME CLOUD CORE INTERFACE FUNCTIONS
// ========================================================

// 1. Fetch live stock inventory matrix rows from Supabase
async function refreshLocalMemoryData() {
    try {
        const { data, error } = await supabase
            .from('products')
            .select('*')
            .order('id', { ascending: true });

        if (error) throw error;
        
        products = data || [];
        
        // Extract unique category designations dynamically from your live products array
        categories = [...new Set(products.map(p => p.category))];
        
        renderAdminInventoryTable();
        populateCategoryDropdown();
    } catch (err) {
        console.error("Database initialization telemetry failed:", err.message);
        showToast("⚠️ Could not load database. Check console logs.");
    }
}

// 2. Add or Edit a product node entry inside Supabase
async function handleFormSubmit(payload) {
    try {
        // Build the structured object matching your database column keys
        const productData = {
            name: payload.name,
            category: payload.category,
            price: parseFloat(payload.price),
            stock: payload.stock,
            details: payload.details,
            images: payload.images && payload.images.length > 0 ? payload.images : ['https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80'],
            video: payload.video || ""
        };

        if (editingProductId !== null) {
            // UPDATE OPERATION: Edit an existing row matching the active ID
            const { error } = await supabase
                .from('products')
                .update(productData)
                .eq('id', editingProductId);

            if (error) throw error;
            showToast("Commodity profile optimized inside Supabase Cloud!");
        } else {
            // INSERT OPERATION: Push a brand new product node row
            const { error } = await supabase
                .from('products')
                .insert([productData]);

            if (error) throw error;
            showToast("New stock node provisioned successfully!");
        }
        
        clearFormAndResetContext();
        refreshLocalMemoryData();
    } catch (err) {
        alert("Supabase Write matrix transaction operation failed: " + err.message);
    }
}

// 3. Quick Table Dropdown Stock Alteration Sync
window.alterStockState = async function(id, newVal) {
    try {
        const { error } = await supabase
            .from('products')
            .update({ stock: newVal })
            .eq('id', id);

        if (error) throw error;
        showToast("Stock matrix status redirected.");
        
        // Refresh local memory silently to keep data consistent
        const target = products.find(p => p.id === id);
        if (target) target.stock = newVal;
    } catch (err) {
        console.error("Stock alter operation breakdown:", err.message);
        showToast("⚠️ Failed to update stock mapping status.");
    }
};

// 4. Permanent Database Row Removal
window.removeProductNode = async function(id) {
    if (!confirm("Permanently wipe this entry from Supabase cloud database registry?")) return;
    try {
        const { error } = await supabase
            .from('products')
            .delete()
            .eq('id', id);

        if (error) throw error;
        showToast("Item wiped out of cloud server database context.");
        refreshLocalMemoryData();
    } catch (err) {
        console.error("Deletion task execution error telemetry:", err.message);
        showToast("⚠️ Failed to purge target data row node.");
    }
};

// ========================================================
// ADMINISTRATIVE PANEL RENDERING CORE INTERFACE
// ========================================================
function populateCategoryDropdown() {
    const dropdown = document.getElementById("product-category");
    if (!dropdown) return;
    
    // Save current user selection fallback
    const currentSelection = dropdown.value;
    dropdown.innerHTML = '<option value="" disabled selected>Select Commodity Class</option>';
    
    categories.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat;
        option.innerText = cat;
        dropdown.appendChild(option);
    });
    
    if (currentSelection) dropdown.value = currentSelection;
}

function renderAdminInventoryTable() {
    const tableBody = document.getElementById("inventory-table-body");
    if (!tableBody) return;
    tableBody.innerHTML = "";

    if (products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" class="py-12 text-center font-mono text-xs text-slate-400">// Cloud database data tier array matrix is entirely unpopulated.</td></tr>`;
        return;
    }

    products.forEach(product => {
        const tr = document.createElement("tr");
        tr.className = "border-b border-slate-100 dark:border-slate-800/60 hover:bg-slate-50/50 dark:hover:bg-slate-900/20 transition-all";
        
        const primaryImg = (product.images && product.images.length > 0) ? product.images[0] : 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80';

        tr.innerHTML = `
            <td class="p-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-slate-100 overflow-hidden border border-slate-200/50"><img src="${primaryImg}" class="w-full h-full object-cover"></div>
                <div>
                    <h4 class="text-xs font-semibold text-brandDark dark:text-white max-w-[180px] truncate">${product.name}</h4>
                    <span class="font-mono text-[9px] uppercase tracking-wider text-slate-400">// ID: ${product.id}</span>
                </div>
            </td>
            <td class="p-4 font-mono text-[10px] text-slate-500 uppercase tracking-wide">${product.category}</td>
            <td class="p-4 font-semibold text-xs text-brandDark dark:text-white">₹${Number(product.price).toLocaleString()}</td>
            <td class="p-4">
                <select onchange="alterStockState(${product.id}, this.value)" class="bg-transparent font-mono text-[11px] font-medium rounded-lg border border-slate-200 dark:border-slate-800 p-1 cursor-pointer focus:outline-none">
                    <option value="In Stock" ${product.stock === 'In Stock' ? 'selected' : ''}>🟢 In Stock</option>
                    <option value="Low Stock" ${product.stock === 'Low Stock' ? 'selected' : ''}>🟡 Low Stock</option>
                    <option value="Out of Stock" ${product.stock === 'Out of Stock' ? 'selected' : ''}>🔴 Out of Stock</option>
                </select>
            </td>
            <td class="p-4 text-right">
                <div class="flex items-center justify-end gap-2">
                    <button onclick="stageProductModification(${product.id})" class="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:text-brandSky text-slate-500 transition-all"><span class="text-[11px] font-mono">EDIT</span></button>
                    <button onclick="removeProductNode(${product.id})" class="p-1.5 rounded-lg bg-rose-50 dark:bg-rose-950/30 text-rose-500 hover:bg-rose-500 hover:text-white transition-all"><span class="text-[11px] font-mono">WIPE</span></button>
                </div>
            </td>`;
        tableBody.appendChild(tr);
    });
}

function initializeFormEngine() {
    const form = document.getElementById("product-management-form");
    if (!form) return;

    form.addEventListener("submit", (e) => {
        e.preventDefault();
        
        const imagesInput = document.getElementById("product-images").value.trim();
        const imagesArray = imagesInput ? imagesInput.split(",").map(url => url.trim()) : [];

        // Dynamic category selection logic
        const dropdownCategory = document.getElementById("product-category").value;
        const customCategory = document.getElementById("new-category-input").value.trim();
        
        // Prioritize the custom typed category if it exists, otherwise fall back to dropdown
        const finalCategory = customCategory || dropdownCategory;

        if (!finalCategory) {
            alert("Please select an existing category or type a brand new one!");
            return;
        }

        const payload = {
            name: document.getElementById("product-name").value.trim(),
            category: finalCategory, // Uses the resolved category name
            price: document.getElementById("product-price").value,
            stock: document.getElementById("form-stock-state").value || "In Stock",
            details: document.getElementById("product-details").value.trim(),
            images: imagesArray,
            video: document.getElementById("product-video") ? document.getElementById("product-video").value.trim() : ""
        };

        handleFormSubmit(payload);
    });
}

window.stageProductModification = function(id) {
    const target = products.find(p => p.id === id);
    if (!target) return;

    editingProductId = id;
    document.getElementById("form-action-title").innerText = `// OPTIMIZE STOCK INDEX NODE #${id}`;
    document.getElementById("form-submit-btn-text").innerText = "Update Matrix Node";

    document.getElementById("product-name").value = target.name;
    document.getElementById("product-price").value = target.price;
    document.getElementById("form-stock-state").value = target.stock;
    document.getElementById("product-details").value = target.details || "";
    document.getElementById("product-images").value = target.images ? target.images.join(", ") : "";
    
    if (document.getElementById("product-video")) {
        document.getElementById("product-video").value = target.video || "";
    }

    // Force add category if it's custom and not in dropdown list elements yet
    const dropdown = document.getElementById("product-category");
    if (dropdown) {
        if (![...dropdown.options].some(opt => opt.value === target.category)) {
            const opt = document.createElement("option");
            opt.value = target.category; opt.innerText = target.category;
            dropdown.appendChild(opt);
        }
        dropdown.value = target.category;
    }
    
    document.getElementById("product-name").focus();
};

function clearFormAndResetContext() {
    editingProductId = null;
    document.getElementById("product-management-form").reset();
    document.getElementById("new-category-input").value = ""; // Clears the custom category box
    document.getElementById("form-action-title").innerText = "// PROVISION NEW STOCK ENGINE NODE";
    document.getElementById("form-submit-btn-text").innerText = "Inject Asset to Cloud";
}

function initializeSystemThemeEngine() {
    const switchBtn = document.getElementById("theme-toggle");
    if (!switchBtn) return;
    switchBtn.addEventListener("click", () => {
        if (document.documentElement.classList.contains('dark')) {
            document.documentElement.classList.remove('dark');
            localStorage.theme = 'light';
        } else {
            document.documentElement.classList.add('dark');
            localStorage.theme = 'dark';
        }
    });
}

function showToast(msg) {
    const toast = document.createElement("div"); 
    toast.className = "toast"; 
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.classList.add("show"), 100);
    setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 300);
    }, 2500);
}
</script>
</body>
</html>
