<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirana NextGen — Digital Storefront</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#0B192C',
            brandGreen: '#10B981',
            brandGreenDeep: '#059669',
            brandSlate: '#1E293B'
          }
        }
      }
    }
  </script>
  <style>
    .glass-card-thick {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .dark .glass-card-thick {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    #cart-sidebar {
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #cart-sidebar.active { transform: translateX(0); }
    #overlay.active { display: block; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#060B13] text-brandDark dark:text-slate-200 antialiased min-h-screen transition-colors duration-300">

  <header class="sticky top-0 z-40 bg-white/80 dark:bg-[#060B13]/80 backdrop-blur-md border-b border-slate-200/60 dark:border-slate-900/60 px-6 py-4">
    <div class="max-w-[1200px] mx-auto flex justify-between items-center">
      <div>
        <span class="font-mono text-[10px] text-brandGreenDeep dark:text-brandGreen tracking-widest uppercase block">// FRESH INVENTORY ENGINE</span>
        <h1 class="text-2xl font-bold tracking-tight text-brandDark dark:text-white">Kirana NextGen</h1>
      </div>
      
      <div class="flex items-center gap-4">
        <button id="theme-toggle" class="p-2.5 rounded-full border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">💡</button>
        <button id="open-cart" class="relative px-5 py-2.5 rounded-full bg-brandDark dark:bg-white text-white dark:text-brandDark text-xs font-mono font-medium flex items-center gap-2">
          🛒 Cart <span id="cart-count" class="bg-brandGreen text-white text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
        <a href="owner.html" class="text-xs font-mono text-slate-400 hover:text-brandGreen transition-colors">Admin Gate →</a>
      </div>
    </div>
  </header>

  <main class="max-w-[1200px] mx-auto px-6 py-8">
    <div class="flex flex-col sm:flex-row gap-4 justify-between items-center mb-8 bg-white dark:bg-slate-900/40 p-4 rounded-2xl border border-slate-200/50 dark:border-slate-900/60">
      <input type="text" id="search-input" placeholder="Search provisions (e.g. Rice, Ghee)..." class="w-full sm:max-w-md px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-950 text-xs border border-transparent focus:border-brandGreen focus:outline-none">
      <select id="category-filter" class="w-full sm:w-52 px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-950 text-xs cursor-pointer focus:outline-none">
        <option value="all">All Architecture Classes</option>
      </select>
    </div>

    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      </div>
  </main>

  <div id="overlay" class="fixed inset-0 bg-brandDark/40 backdrop-blur-sm z-50 hidden"></div>
  <aside id="cart-sidebar" class="fixed top-0 right-0 h-full w-full max-w-md bg-white dark:bg-[#0b1320] shadow-2xl z-50 flex flex-col justify-between border-l border-slate-200 dark:border-slate-900">
    <div class="p-6 border-b border-slate-100 dark:border-slate-900/60 flex justify-between items-center">
      <h2 class="text-lg font-bold text-brandDark dark:text-white">Order Manifest</h2>
      <button id="close-cart" class="text-slate-400 hover:text-brandDark dark:hover:text-white text-xl">✕</button>
    </div>
    
    <div id="cart-items" class="p-6 flex-1 overflow-y-auto flex flex-col gap-4">
      </div>

    <div class="p-6 border-t border-slate-100 dark:border-slate-900/60 bg-slate-50/50 dark:bg-slate-950/40">
      <div class="flex justify-between items-center mb-4">
        <span class="text-xs font-mono text-slate-400 uppercase tracking-wider">Estimated Total</span>
        <span class="text-xl font-bold text-brandDark dark:text-white">₹<span id="cart-total">0</span></span>
      </div>
      <button class="checkout-btn w-full py-4 rounded-2xl bg-brandGreen hover:bg-brandGreenDeep text-white text-xs font-mono tracking-wider font-bold shadow-lg transition-all active:scale-[0.98]">
        LAUNCH WHATSAPP PROVISION PROTOCOL
      </button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
