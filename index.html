<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajkumar Kirana — Premium Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#0B192C',
            brandSky: '#38BDF8',
            brandSkyDeep: '#0EA5E9',
            brandSlate: '#1E293B'
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white dark:bg-[#060B13] text-brandDark dark:text-slate-200 antialiased transition-colors duration-300">

  <div class="bg-blur bg1 opacity-20"></div>
  <div class="bg-blur bg2 opacity-20"></div>

  <header class="sticky top-0 z-40 w-full bg-white/75 dark:bg-[#060B13]/75 backdrop-blur-md border-b border-slate-100 dark:border-slate-900/60 h-20 flex items-center">
    <div class="max-w-[1400px] w-full mx-auto px-6 flex justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brandSkyDeep to-brandSky flex items-center justify-center text-white shadow-lg">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-brandDark dark:text-white leading-none">Rajkumar Kirana</h1>
          <span class="text-[10px] font-mono tracking-wider text-brandSkyDeep dark:text-brandSky uppercase mt-1 block">// Realtime Connected Storage Matrix</span>
        </div>
      </div>

      <div class="hidden md:flex items-center flex-1 max-w-md mx-8 relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5"></i>
        <input type="text" id="store-search-input" oninput="renderStorefrontGrid()" placeholder="Filter storage nodes by runtime criteria..." 
               class="w-full text-xs bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-full pl-10 pr-4 py-2.5 outline-none focus:border-brandSky transition-all">
      </div>

      <div class="flex items-center gap-4">
        <button id="theme-toggle" class="w-10 h-10 rounded-full border border-slate-200 dark:border-slate-800 flex items-center justify-center bg-slate-50 dark:bg-slate-900 text-brandDark dark:text-white">
          <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
          <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
        </button>
        
        <button onclick="toggleCartDrawerOpenState(true)" class="px-4 h-11 rounded-full bg-brandDark dark:bg-white text-white dark:text-brandDark flex items-center gap-2 shadow-lg hover:bg-brandSkyDeep transition-all group relative">
          <i data-lucide="shopping-cart" class="w-4 h-4"></i>
          <span class="text-xs font-mono font-medium hidden sm:inline">Basket</span>
          <span id="cart-counter-badge" class="min-w-5 h-5 px-1 rounded-full bg-brandSkyDeep dark:bg-brandDark text-[10px] text-white font-mono flex items-center justify-center font-bold">0</span>
        </button>

        <a href="owner.html" class="w-10 h-10 rounded-full border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 flex items-center justify-center text-slate-500 hover:text-brandSkyDeep transition-all">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-[1400px] mx-auto px-6 py-8">
    <section class="mb-10">
      <div id="category-filter-rail" class="flex items-center gap-2 overflow-x-auto pb-3 select-none">
        <button onclick="filterSelectedCategory('all')" id="cat-btn-all" class="px-5 py-2 rounded-full border text-xs font-medium font-mono whitespace-nowrap transition-all border-brandSkyDeep bg-brandSkyDeep text-white shadow-md">All Items</button>
      </div>
    </section>

    <section>
      <div id="store-grid-viewport" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </section>
  </main>

  <div id="cart-overlay-shroud" onclick="toggleCartDrawerOpenState(false)" class="fixed inset-0 z-50 bg-brandDark/40 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300"></div>
  
  <aside id="cart-drawer-container" class="fixed right-0 top-0 bottom-0 z-50 w-full sm:w-[440px] bg-white dark:bg-[#0b1220] shadow-2xl border-l border-slate-100 dark:border-slate-900/60 translate-x-full transition-transform duration-300 flex flex-col justify-between">
    <div class="p-6 border-b border-slate-100 dark:border-slate-900/60 flex justify-between items-center bg-slate-50/50 dark:bg-slate-950/20">
      <div class="flex items-center gap-2">
        <i data-lucide="shopping-basket" class="w-4 h-4 text-brandSkyDeep"></i>
        <h3 class="text-base font-bold text-brandDark dark:text-white">Your Shopping Basket</h3>
      </div>
      <button onclick="toggleCartDrawerOpenState(false)" class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-900 flex items-center justify-center text-slate-400">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <div id="cart-items-scroller" class="flex-1 p-6 overflow-y-auto space-y-4"></div>

    <div class="p-6 border-t border-slate-100 dark:border-slate-900/60 bg-slate-50/50 dark:bg-slate-950/20 space-y-4">
      <div class="space-y-1.5 font-mono text-xs flex justify-between text-base font-bold text-brandDark dark:text-white pt-2">
        <span>Grand Total Matrix:</span>
        <span class="text-emerald-600 dark:text-emerald-400" id="bill-grand-total">₹0</span>
      </div>
      <button onclick="commitOrderToWhatsAppPipe()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-mono font-medium text-xs rounded-xl flex items-center justify-center gap-2 shadow-lg transition-all hover:scale-[1.01]">
        <i data-lucide="send" class="w-4 h-4"></i> Dispatch Order via WhatsApp Pipeline
      </button>
    </div>
  </aside>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
/**
 * Velloux Kirana System — Storefront Matrix UI
 * Synchronized with Live Supabase Cloud Database Core
 */

// ========================================================
// SUPABASE CLIENT INITIALIZATION CONFIGURATION
// ========================================================
const SUPABASE_URL = "sb_publishable_J39e0-43SDOkDm5BNiwz5w_vP312Wau";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyc295b2R2b3N1b3ZxdGlzbW9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTg2NjgsImV4cCI6MjA5NTM3NDY2OH0.kJYdFik2YAOk3FXTHieOPEI5esy3I_7R5MG-Sz6X3g0";

// Initialize the active connection client instance
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ========================================================
// REPOSITORY TARGET VARIABLES
// ========================================================
let products = [];
let categories = [];
let cart = [];
let currentModalProduct = null;
let currentModalQty = 1;

// --- LIFE CYCLE INITIALIZATION ---
document.addEventListener("DOMContentLoaded", () => {
  if (typeof lucide !== 'undefined') lucide.createIcons();
  
  // Trigger immediate live database data extraction pool
  fetchStoreCatalogDatabase();

  initializeStoreControls();
  initializeCartSidebarEvents();
  initializeAdaptiveScrollTelemetry();
  initializeSystemThemeEngine();
});

// ========================================================
// SUPABASE REALTIME CLOUD PULL CORE ENGINE
// ========================================================
async function fetchStoreCatalogDatabase() {
  try {
    // Fetch all records out of your Supabase live cloud table sorted by product ID mapping
    const { data, error } = await supabase
      .from('products')
      .select('*')
      .order('id', { ascending: true });

    if (error) throw error;

    // Route cloud responses over to your existing UI renderer array matrices
    products = data || [];
    
    // Extract unique category designations dynamically from the updated products array
    categories = [...new Set(products.map(p => p.category))];
    
    // Update structural UI templates instantly with fresh live assets
    populateDynamicFilterDropdown();
    renderStorefrontProducts(products);
    
  } catch (err) {
    console.error("Supabase pipeline breakdown telemetry log:", err.message);
    // Secure safe fallbacks so the app components don't crash
    products = [];
    categories = [];
  }
}

// ========================================================
// UI RENDERING AND LOGIC IMPLEMENTATION FLOW
// ========================================================
function populateDynamicFilterDropdown() {
  const filterSelect = document.getElementById("category-filter");
  if (!filterSelect) return;
  const currentVal = filterSelect.value || "all";
  filterSelect.innerHTML = '<option value="all">All Product Classes</option>';
  categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat; 
    opt.innerText = cat;
    filterSelect.appendChild(opt);
  });
  filterSelect.value = currentVal;
}

function renderStorefrontProducts(items) {
  const productsGrid = document.getElementById("products-grid");
  if (!productsGrid) return;
  
  const text = document.getElementById("search-input") ? document.getElementById("search-input").value.toLowerCase() : "";
  const cat = document.getElementById("category-filter") ? document.getElementById("category-filter").value : "all";
  
  const filtered = items.filter(p => p.name.toLowerCase().includes(text) && (cat === "all" || p.category === cat));
  filtered.sort((a, b) => a.id - b.id);
  
  if (filtered.length === 0) {
    productsGrid.innerHTML = `<div class="col-span-full py-16 text-center"><h2 class="text-sm font-mono text-slate-400">No matching models discovered in backend matrix registry.</h2></div>`;
    return;
  }

  let gridHTML = "";
  filtered.forEach(product => {
    const primaryImg = (product.images && product.images.length > 0) ? product.images[0] : 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80';
    const isOutOfStock = product.stock === 'Out of Stock';

    gridHTML += `
      <div class="glass-card-thick rounded-[28px] p-5 flex flex-col justify-between group cursor-pointer js-animate animate-active" onclick="openProductModal(${product.id})">
        <div>
          <div class="w-full h-[180px] rounded-2xl overflow-hidden bg-slate-200/50 dark:bg-slate-950/50 mb-4 border border-white/20 relative">
            <img src="${primaryImg}" class="w-full h-full object-cover group-hover:scale-105 transition-all duration-500" alt="${product.name}">
          </div>
          <div class="flex justify-between items-center mb-2">
            <span class="font-mono text-[9px] uppercase tracking-wider text-slate-400">// ${product.category}</span>
            <span class="text-[10px] font-medium text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded-full">⭐ ${product.rating || 4.5}</span>
          </div>
          <h3 class="text-base font-semibold tracking-tight text-brandDark dark:text-white mb-1 group-hover:text-brandSky">${product.name}</h3>
          <p class="text-[10px] font-mono tracking-wide ${isOutOfStock ? 'text-rose-500' : 'text-emerald-500'} mb-4">${product.stock}</p>
        </div>
        <div class="flex items-center justify-between pt-3 border-t border-slate-200/30 mt-2">
          <span class="text-base font-bold text-brandDark dark:text-white">₹${Number(product.price).toLocaleString()}</span>
          <button class="px-4 py-1.5 rounded-full bg-brandDark dark:bg-white text-white dark:text-brandDark font-mono text-[11px] font-medium transition-all" 
                  onclick="event.stopPropagation(); triggerDirectCardPurchase(${product.id})" ${isOutOfStock ? 'disabled style="opacity: 0.4;"' : ''}>
            ${isOutOfStock ? 'Sold Out' : 'Add to Cart'}
          </button>
        </div>
      </div>`;
  });
  
  productsGrid.innerHTML = gridHTML;
}

function initializeStoreControls() {
  const searchInput = document.getElementById("search-input");
  const categoryFilter = document.getElementById("category-filter");
  if (!searchInput || !categoryFilter) return;

  const handleInputEvent = () => renderStorefrontProducts(products);
  searchInput.addEventListener("input", handleInputEvent);
  categoryFilter.addEventListener("change", handleInputEvent);
}

window.openProductModal = function(id) {
  const target = products.find(p => p.id === id);
  if (!target) return;

  currentModalProduct = target; 
  currentModalQty = 1;
  document.getElementById("modal-qty-counter").innerText = currentModalQty;
  document.getElementById("modal-name").innerText = target.name;
  document.getElementById("modal-category").innerText = `// ${target.category}`;
  document.getElementById("modal-details").innerText = target.details || "No specifications loaded.";
  document.getElementById("modal-price").innerText = `₹${Number(target.price).toLocaleString()}`;

  const stockEl = document.getElementById("modal-stock");
  stockEl.innerText = target.stock;
  if (target.stock === "Out of Stock") {
    stockEl.className = "text-xs font-mono mb-4 text-rose-500";
    document.getElementById("modal-action-btn").disabled = true;
    document.getElementById("modal-action-btn").innerText = "Sold Out Engine Asset";
    document.getElementById("modal-action-btn").style.opacity = "0.4";
  } else {
    stockEl.className = "text-xs font-mono mb-4 text-emerald-500";
    document.getElementById("modal-action-btn").disabled = false;
    document.getElementById("modal-action-btn").innerText = "Add To Deployment Cart";
    document.getElementById("modal-action-btn").style.opacity = "1";
    document.getElementById("modal-action-btn").setAttribute("onclick", `addModalItemToCart()`);
  }

  const mediaContainer = document.getElementById("modal-main-media");
  const thumbContainer = document.getElementById("modal-thumbnails");
  if (mediaContainer) mediaContainer.innerHTML = ""; 
  if (thumbContainer) thumbContainer.innerHTML = "";

  let assetImages = target.images && target.images.length > 0 ? target.images : ["https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80"];
  setModalMainDisplayAsset(assetImages[0], 'image');

  assetImages.forEach((imgUrl, idx) => {
    const thumb = document.createElement("img");
    thumb.src = imgUrl;
    thumb.className = `w-12 h-12 rounded-lg object-cover cursor-pointer border-2 transition-all ${idx === 0 ? 'border-brandSkyDeep' : 'border-transparent'}`;
    thumb.onclick = () => {
      document.querySelectorAll("#modal-thumbnails img").forEach(i => i.classList.remove("border-brandSkyDeep"));
      thumb.classList.add("border-brandSkyDeep");
      setModalMainDisplayAsset(imgUrl, 'image');
    };
    thumbContainer.appendChild(thumb);
  });

  if (target.video && target.video.trim() !== "") {
    const vThumb = document.createElement("div");
    vThumb.className = "w-12 h-12 rounded-lg bg-brandDark text-brandSky flex items-center justify-center cursor-pointer text-xs font-mono font-bold";
    vThumb.innerText = "VIDEO";
    vThumb.onclick = () => { setModalMainDisplayAsset(target.video, 'video'); };
    thumbContainer.appendChild(vThumb);
  }

  document.getElementById("product-details-modal").classList.remove("hidden");
  document.getElementById("product-details-modal").classList.add("flex");
};

function setModalMainDisplayAsset(url, type) {
  const container = document.getElementById("modal-main-media");
  if (!container) return; 
  container.innerHTML = "";
  container.innerHTML = type === 'video' ? `<video src="${url}" controls autoplay muted loop class="w-full h-full object-cover rounded-2xl"></video>` : `<img src="${url}" class="w-full h-full object-cover rounded-2xl">`;
}

window.closeProductModal = function() {
  document.getElementById("product-details-modal").classList.add("hidden");
  document.getElementById("product-details-modal").classList.remove("flex");
  currentModalProduct = null;
};

window.adjustModalQty = function(delta) {
  currentModalQty += delta; 
  if (currentModalQty < 1) currentModalQty = 1;
  document.getElementById("modal-qty-counter").innerText = currentModalQty;
};

function triggerDirectCardPurchase(id) {
  const target = products.find(p => p.id === id);
  if (!target || target.stock === 'Out of Stock') return;
  pushStagedCartAllocation(target, 1);
}

window.addModalItemToCart = function() {
  if (!currentModalProduct) return;
  pushStagedCartAllocation(currentModalProduct, currentModalQty);
  closeProductModal();
};

function pushStagedCartAllocation(item, quantity) {
  const existingRecord = cart.find(c => c.product.id === item.id);
  if (existingRecord) { 
    existingRecord.quantity += quantity; 
  } else { 
    cart.push({ product: item, quantity: quantity }); 
  }
  updateCartDisplayMatrix();
  showToast(`${quantity}x ${item.name} added to cart.`);
}

function updateCartDisplayMatrix() {
  const count = document.getElementById("cart-count");
  const container = document.getElementById("cart-items");
  const totalDisplay = document.getElementById("cart-total");
  if (!count || !container || !totalDisplay) return;

  count.innerText = cart.reduce((sum, current) => sum + current.quantity, 0);
  container.innerHTML = "";
  let totalSum = 0;

  if (cart.length === 0) {
    container.innerHTML = `<div class="py-12 text-center"><h3 class="text-xs font-mono text-slate-400">Cart is empty.</h3></div>`;
    totalDisplay.innerText = "0"; 
    return;
  }

  cart.forEach((entry, index) => {
    totalSum += Number(entry.product.price) * entry.quantity;
    const primaryImg = (entry.product.images && entry.product.images.length > 0) ? entry.product.images[0] : 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80';
    const div = document.createElement("div");
    div.className = "flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-100";
    div.innerHTML = `
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded bg-slate-200 overflow-hidden"><img src="${primaryImg}" class="w-full h-full object-cover"></div>
        <div>
          <h4 class="text-xs font-medium max-w-[150px] truncate">${entry.product.name}</h4>
          <p class="text-[11px] font-mono">₹${Number(entry.product.price).toLocaleString()} <span>x${entry.quantity}</span></p>
        </div>
      </div>
      <button class="text-xs text-red-400 hover:text-red-600" onclick="removeItemFromCart(${index})">✕</button>`;
    container.appendChild(div);
  });
  totalDisplay.innerText = totalSum.toLocaleString();
}

window.removeItemFromCart = function(index) { 
  cart.splice(index, 1); 
  updateCartDisplayMatrix(); 
};

function initializeCartSidebarEvents() {
  const sidebar = document.getElementById("cart-sidebar");
  const overlay = document.getElementById("overlay");
  if (!sidebar || !overlay) return;

  window.openCart = () => { sidebar.classList.add("active"); overlay.classList.add("active"); };
  const closeCart = () => { sidebar.classList.remove("active"); overlay.classList.remove("active"); };

  if (document.getElementById("open-cart")) document.getElementById("open-cart").addEventListener("click", window.openCart);
  if (document.getElementById("close-cart")) document.getElementById("close-cart").addEventListener("click", closeCart);
  overlay.addEventListener("click", closeCart);

  const chkBtn = document.querySelector(".checkout-btn");
  if (chkBtn) {
    chkBtn.addEventListener("click", () => {
      if (cart.length === 0) return;
      let msg = "Velloux Kirana Sourcing Order Protocol:%0A%0A";
      cart.forEach((entry, i) => { 
        msg += `${i+1}. ${entry.product.name}%0A   Qty: ${entry.quantity}%0A   Rate: ₹${Number(entry.product.price).toLocaleString()}%0A%0A`; 
      });
      window.open(`https://wa.me/917030024001?text=${msg}`, "_blank");
    });
  }
}

function initializeAdaptiveScrollTelemetry() {
  const items = document.querySelectorAll(".js-animate");
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("animate-active"); observer.unobserve(e.target); } });
  }, { threshold: 0.05 });
  items.forEach(i => observer.observe(i));
}

function initializeSystemThemeEngine() {
  const switchBtn = document.getElementById("theme-toggle");
  if (!switchBtn) return;
  switchBtn.addEventListener("click", () => {
    if (document.documentElement.classList.contains('dark')) { 
      document.documentElement.classList.remove('dark'); 
      localStorage.theme = 'light'; 
    } else { 
      document.documentElement.classList.add('dark'); 
      localStorage.theme = 'dark'; 
    }
  });
}

function showToast(msg) {
  const toast = document.createElement("div"); 
  toast.className = "toast"; 
  toast.innerText = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add("show"), 100);
  setTimeout(() => { 
    toast.classList.remove("show"); 
    setTimeout(() => toast.remove(), 300); 
  }, 2500);
}
</script>
</body>
</html>
